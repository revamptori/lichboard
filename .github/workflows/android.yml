name: Android APK and device verification
on:
  push:
    branches: ['arena/**']
    paths-ignore: ['verification/**', 'releases/**', '**.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    name: Verify Standard + Assist on Android 11 + 15
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - name: Build, JVM tests and Android Lint
        id: build
        run: |
          set -o pipefail
          mkdir -p verification
          rm -rf verification/api-30 verification/api-35 verification/unit-tests
          rm -rf verification/apks
          rm -f verification/ci-*.log verification/apk-signature.txt verification/apk-badging.txt verification/apk-capabilities.json verification/lint-results-*.txt
          ./gradlew --no-daemon :app:assembleStandardDebug :app:assembleStandardDebugAndroidTest :app:assembleStandardRelease :app:testStandardDebugUnitTest :app:lintStandardDebug :app:assembleAssistDebug :app:assembleAssistDebugAndroidTest :app:assembleAssistRelease :app:testAssistDebugUnitTest :app:lintAssistDebug 2>&1 | tee ci-build.log
          python3 scripts/verify-apks.py
      - name: Enable hardware virtualization
        if: steps.build.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 11 instrumented device tests and release smoke test
        id: api30
        if: steps.build.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/device-test.sh 30
      - name: Android 15 instrumented device tests and release smoke test
        id: api35
        if: always() && steps.build.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/device-test.sh 35
      - name: Save deliverables and evidence on this branch
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          API30_OUTCOME: ${{ steps.api30.outcome }}
          API35_OUTCOME: ${{ steps.api35.outcome }}
        run: bash scripts/publish-ci.sh
      - name: Upload complete build artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lichboard-apk-and-verification
          path: |
            app/build/outputs/apk/*/release/*.apk
            app/build/reports/
            app/build/outputs/androidTest-results/
            verification/
            ci-*.log
          retention-days: 14
